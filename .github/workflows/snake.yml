name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?color_snake=%23ECEDEF&color_dots=%2316191D,%2342300F,%238A5F22,%23C98A2E,%23F0A53A
            dist/github-snake.svg?color_snake=%230B0C0E&color_dots=%23EDEEF0,%23F6DDB4,%23F2C177,%23EDA83F,%23C97F12

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
